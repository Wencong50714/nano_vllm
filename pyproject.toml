[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm"
version = "0.2.0"
authors = [{ name = "Zonghao Chen" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "a lightweight vLLM implementation built from scratch"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "triton>=3.0.0",
    "transformers>=4.51.0",
    "flash-attn",
    "xxhash",
    "pybase64",
    # Profiler
    "py-spy",
]

[project.optional-dependencies]
multi-modal = [
    # For image processing
    "pillow",
    "torchvision",
    "qwen-vl-utils",

    # For video processing
    "decord",
]

all = [
    "nano-vllm[multi-modal]",
]

[project.urls]
Homepage="https://github.com/Wencong50714/nano_vllm"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true
